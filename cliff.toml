[changelog]
header = """
# Changelog\n
All notable changes to Athelas will be documented in this file.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
          {% if commit.breaking %}**BREAKING:** {% endif %}\
          {{ commit.message | upper_first }}\
          {% if commit.breaking and commit.breaking_description %} — \
          {{ commit.breaking_description }}{% endif %}
    {%- endfor %}
    {% raw %}\n{% endraw %}\
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
postprocessors = [
    { pattern = '\(#([0-9]+)\)', replace = '([#${1}](https://github.com/athelas-astro/athelas/pull/${1}))' },
]

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
    { message = "^feat", group = "<!-- 1 -->Features" },
    { message = "^fix", group = "<!-- 2 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 3 -->Performance" },
    { message = "^doc", group = "<!-- 4 -->Documentation" },
    { message = "^refactor", group = "<!-- 5 -->Refactoring" },
    { message = "^chore", skip = true },
    { message = "^test", skip = true },
    { message = "^style", skip = true },
    { message = "^build", skip = true },
    { message = "^ci", skip = true },
    { message = "^fmt", skip = true },
    { message = "^misc", skip = true },
]
protect_breaking_commits = true
filter_commits = true
fail_on_unmatched_commit = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "newest"
